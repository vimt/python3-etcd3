name: Publish to PyPI

# Push a tag like v0.14.0 to publish. Uses PyPI Trusted Publishing (OIDC):
# the publisher configured on PyPI must name this workflow file (publish.yml)
# and, if it names an environment, the environment below.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check the tag matches the package version
      run: |
        version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('etcd3/__init__.py').read())[1])")
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "tag $GITHUB_REF_NAME does not match etcd3.__version__ ($version)"
          exit 1
        fi

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade build
        python -m build

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@release/v1
