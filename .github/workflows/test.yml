name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  ETCD_VERSION: v3.5.17

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Ruff
      run: |
        ruff check etcd3/ tests/
        ruff format --check etcd3/ tests/

    - name: Type checking
      run: mypy etcd3/

  test:
    name: test (py${{ matrix.python-version }}, protobuf ${{ matrix.protobuf }})
    # ubuntu-22.04 still provides Python 3.8
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        protobuf: ["latest"]
        include:
          # The generated etcdrpc/*_pb2.py need protobuf >= 5.29: test the floor
          # declared in pyproject.toml so it cannot silently drift again.
          - python-version: "3.8"
            protobuf: "5.29.0"
          - python-version: "3.12"
            protobuf: "5.29.0"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install etcd ${{ env.ETCD_VERSION }}
      run: |
        curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
        echo "/tmp/etcd-${ETCD_VERSION}-linux-amd64" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pifpaf
        if [ "${{ matrix.protobuf }}" != "latest" ]; then
          pip install "protobuf==${{ matrix.protobuf }}"
        fi
        pip list | grep -iE "^(protobuf|grpcio) "

    - name: Unit tests (no etcd)
      run: pytest -m "not integration" -v --timeout=120

    - name: All tests (3-node etcd cluster via pifpaf)
      env:
        PYTHON_ETCD_HTTP_URL: http://127.0.0.1:2479
      run: |
        pifpaf run etcd --cluster --port 2479 --peer-port 2480 -- \
          pytest -v --timeout=120 --cov=etcd3 --cov-report=term-missing
